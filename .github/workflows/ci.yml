name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
      - run: npm run build
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run desktop:pack
      - run: npx playwright test --config playwright.desktop.config.ts
        env:
          EXPERTMESH_DESKTOP_EXECUTABLE: release/win-unpacked/ExpertMesh.exe
      - uses: actions/upload-artifact@v4
        with:
          name: expertmesh-windows-preview
          path: release/win-unpacked
          retention-days: 7
